<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel docente privado · Quiz V02</title><link rel="stylesheet" href="css/app.css"></head><body>
<main class="shell"><header class="brand"><div class="brand-mark">D</div><div><p class="eyebrow">Acceso privado</p><h1>Panel docente · V02</h1></div></header>
<section id="loginScreen" class="card"><h2>Iniciar sesión</h2><p class="muted">Autenticación administrada por Supabase. No existe una clave embebida en este sitio.</p><form id="loginForm" class="form-grid"><div><label for="email">Correo docente</label><input id="email" type="email" autocomplete="username" required></div><div><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><div id="loginError" class="error hidden" role="alert"></div><button class="btn" type="submit">Entrar</button></form></section>
<section id="panelScreen" class="hidden"><div class="card"><div class="actions"><div><p class="eyebrow">Resultados centrales</p><h2>Intentos registrados</h2></div><button id="logoutBtn" class="btn ghost">Cerrar sesión</button></div>
<div class="toolbar"><div><label for="search">Buscar</label><input id="search" type="search" placeholder="Nombre, código o verificación"></div><div><label for="statusFilter">Estado</label><select id="statusFilter"><option value="">Todos</option><option value="completed">Completos</option><option value="timed_out">Tiempo agotado</option><option value="in_progress">En curso</option><option value="exhausted">Código agotado</option></select></div><div><label for="attemptFilter">Intento</label><select id="attemptFilter"><option value="">Todos</option><option>1</option><option>2</option><option>3</option></select></div><button id="refreshBtn" class="btn secondary">Actualizar</button><button id="csvBtn" class="btn">Exportar CSV</button></div><div class="spacer"></div><p id="summary" class="muted"></p><div id="panelError" class="error hidden"></div>
<div class="table-wrap"><table><thead><tr><th>Estudiante</th><th>Código</th><th>Intento</th><th>Inicio</th><th>Finalización</th><th>Duración</th><th>Nota</th><th>Estado</th><th>Disponibilidad</th><th></th></tr></thead><tbody id="attemptRows"></tbody></table></div></div></section>
<dialog id="detailDialog"><div class="actions"><h2>Detalle del intento</h2><button id="closeDetail" class="btn ghost">Cerrar</button></div><div id="detailArea"></div></dialog></main>
<script src="js/config.js"></script><script src="js/quiz-core.js"></script><script src="js/supabase-api.js"></script><script src="js/teacher.js"></script></body></html>
